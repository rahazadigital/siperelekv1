<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="50%" stop-color="#0e2a56"/>
      <stop offset="100%" stop-color="#051024"/>
    </linearGradient>

    <!-- Ring Circle Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lightning Glow Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coin Badge Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Rim Stroke -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Glowing Circular Frame -->
  <circle cx="256" cy="210" r="145" fill="none" stroke="url(#ringGrad)" stroke-width="16" opacity="0.9" filter="url(#glow)"/>

  <!-- House Silhouette in Background -->
  <g filter="url(#shadow)">
    <!-- Roof line -->
    <path d="M140 180 L256 95 L372 180" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- House Window -->
    <rect x="290" y="165" width="40" height="40" rx="6" fill="#f8fafc"/>
    <line x1="310" y1="165" x2="310" y2="205" stroke="#0e2a56" stroke-width="4"/>
    <line x1="290" y1="185" x2="330" y2="185" stroke="#0e2a56" stroke-width="4"/>
  </g>

  <!-- Invoice / Bill Document -->
  <g filter="url(#shadow)">
    <rect x="250" y="210" width="130" height="105" rx="14" fill="#f8fafc"/>
    <!-- Bill Lines -->
    <line x1="268" y1="235" x2="320" y2="235" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="268" y1="255" x2="345" y2="255" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="268" y1="275" x2="335" y2="275" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="268" y1="295" x2="310" y2="295" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Rp Coin Badge -->
  <g filter="url(#shadow)">
    <circle cx="370" cy="290" r="42" fill="url(#coinGrad)" stroke="#f8fafc" stroke-width="6"/>
    <text x="370" y="303" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-1">Rp</text>
  </g>

  <!-- Radiant Lightning Bolt -->
  <g filter="url(#glow)">
    <polygon points="295,45 180,225 240,225 150,335 300,165 240,165" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- App Typography: IURAN RT / RW -->
  <text x="256" y="415" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="900" font-size="62" fill="#ffffff" letter-spacing="3">IURAN</text>
  
  <g>
    <line x1="120" y1="450" x2="165" y2="450" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <text x="256" y="459" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="800" font-size="28" fill="#38bdf8" letter-spacing="4">RT / RW</text>
    <line x1="347" y1="450" x2="392" y2="450" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
